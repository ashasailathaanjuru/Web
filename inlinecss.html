<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>inlinecss</title>
</head>
<body>
   <h1 style="color: blue; text-align: center;"> My Website</h1> 
   <!--The style is applied directly to this paragraph-->
   <p style="color: rgb(22, 176, 11);"> This is  an example of Inline CSS.</p>
   <!--Another element with its own style-->
   <button style="background-color: black; color: white;">Click Me</button>
</body>
</html>
