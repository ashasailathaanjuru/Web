<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS</title>
    <style>
        h1{
            color: blue;
            text-align: center;
        }
        p{
            color: rgb(245, 35, 35);
                font-size: 20px;
            line-height: 1.5;
        }
        .box1{
            border:3px dashed rgb(98, 237, 33);
            border-radius: 15px
        }
        .box2{
            border:3px dotted purple
        }
        .box3{
             border:3px double rgb(237, 172, 52)
        }
        .box4{
            border:3px solid rgb(27, 237, 90)
        }
    </style>
</head>
<body>
    <h1>CSS Borders</h1>
    <p>This paragraph has has a solid border.</p>
    <p class="box1">This is a dashed border</p>
    <p class="box2">This is a dotted border</p>
    <p class="box3">This is a double border</p>
    <p class="box4">This is a rounded border</p>
</body>
</html>
