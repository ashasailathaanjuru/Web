<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>margin</title>
</head>
<style>
    h1{
        border: 2px solid rebeccapurple;
        margin: 20px;
        padding: 20px 40px;
    }
    p{
        border: 2px solid rgb(176, 115, 237);
        margin-top: 10px;
        margin-right: 20px;
        margin-bottom: 30px;
        margin-left: 40px;

    }
    h2{
        border: 2px solid rgb(237, 117, 26);
        margin: 30px 40px;
    }
    div{
        width:200px;
        border: 2px solid rgb(192, 100, 245);
        margin: 20px auto;
    }
    .Asha{
        border: 5px solid rgb(237, 117, 26);
        margin: 20px 30px;
        padding: 20px 30px;
    }
</style>
<body>
    <h1>MAHESH BABU</h1>
    <p>MAHESH is known as Superstar, is an Indian actor, producer, media personality, and philanthropist in Telugu cinema.</p>
         <h2>KHALEJA</h2>
     <div>Khaleja – Alluri Seetharama Raju</div>   
     <h6 class="Asha">POKIRI</h6>  
</body>
</html>

<!-- margin: 20px;-all four sides.
 margin:10px 20px;-top/ bottom and left/right
 margin:10px 20px 30px 40px;- top,right,bottom,left.
 specified width.-->
